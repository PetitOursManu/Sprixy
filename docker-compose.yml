# Sprixy — docker compose (also works as a Coolify "Docker Compose" resource).
services:
  sprixy:
    build: .
    image: sprixy:latest
    restart: unless-stopped
    ports:
      - "${SPRIXY_PORT:-3210}:3210"
    environment:
      # 32 random bytes, base64 — encrypts provider API keys at rest. KEEP IT SAFE.
      # Generate: openssl rand -base64 32
      SPRIXY_MASTER_KEY: ${SPRIXY_MASTER_KEY:?Set SPRIXY_MASTER_KEY (openssl rand -base64 32)}
      SPRIXY_ALLOW_SIGNUP: ${SPRIXY_ALLOW_SIGNUP:-false}
      SPRIXY_SECURE_COOKIES: ${SPRIXY_SECURE_COOKIES:-false}
      SPRIXY_PUBLIC_URL: ${SPRIXY_PUBLIC_URL:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      - sprixy-data:/data

volumes:
  sprixy-data:
